services:
  - type: web
    name: tds-data-bot
    runtime: python
    plan: starter          # a non-sleeping plan so it stays reachable during grading
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PUBLIC_BASE_URL
        sync: false        # set to the service's own https URL after first deploy
